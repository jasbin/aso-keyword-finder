[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aso-keyword-finder"
version = "1.0.0"
description = "Find and score App Store / Google Play keywords from store autocomplete."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jasbin Karki" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
keyfinder = "keyfinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keyfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["keyfinder"]
plugins = ["pydantic.mypy"]
